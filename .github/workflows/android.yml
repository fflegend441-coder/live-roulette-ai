name: Build Immersive Roulette APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      accept-android-sdk-licenses: true

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check ZIP File
    run: |
      test -f live_roulette_ai_immersive_history_ocr.zip

  - name: Extract Android Project
    run: |
      mkdir -p extracted
      unzip -q live_roulette_ai_immersive_history_ocr.zip -d extracted

  - name: Verify Android Project
    run: |
      test -f extracted/settings.gradle
      test -f extracted/build.gradle
      test -f extracted/app/build.gradle
      test -f extracted/app/src/main/AndroidManifest.xml

  - name: Build Debug APK
    run: |
      gradle -p extracted assembleDebug --stacktrace

  - name: Verify APK
    run: |
      ls -lh extracted/app/build/outputs/apk/debug/
      test -f extracted/app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Immersive-Roulette-APK
      path: extracted/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error


