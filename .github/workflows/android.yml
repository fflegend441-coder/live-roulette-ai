
name: Build Immersive Roulette APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          ZIP_FILE="$(find . -name 'ImmersiveRouletteAI.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="extracted/ImmersiveRouletteAI"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"T_DDTT_DI

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Verify APK
        id: verify
        run: |
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Immersive-Roulette-APK
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error



