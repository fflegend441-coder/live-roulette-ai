name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/live_roulette_ai_starter assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Live-Roulette-AI-APK
          path: extracted/live_roulette_ai_starter/app/build/outputs/apk/debug/app-debug.apk
